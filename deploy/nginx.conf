# AGMCIS Nginx(Master Prompt 第八十二節)。
#
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/agmcis
#     sudo ln -s /etc/nginx/sites-available/agmcis /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 這個檔案**不會自己套用**。它是一份要你檢查過再放上去的設定 ——
#    改壞 nginx 會讓整個系統從外面連不進去,而那時候你連儀表板都看不到。
#
# 先跑 `nginx -t`。它會在重載之前告訴你語法對不對。

# uvicorn 監聽 127.0.0.1:8000 —— **只綁 localhost**。
# 綁 0.0.0.0 的話,任何人只要知道 IP 就繞過 nginx 直接打 API,
# 而下面所有的限流與 HTTPS 就都沒有意義了。
upstream agmcis {
    server 127.0.0.1:8000 fail_timeout=0;
}

# 限流。交易系統的 API 不該被暴力嘗試金鑰。
#
# 10r/s 對正常使用綽綽有餘(儀表板每分鐘更新一次),
# 但足以讓字典攻擊變得沒有意義。
limit_req_zone $binary_remote_addr zone=agmcis_api:10m rate=10r/s;

# 登入那一條更嚴。它是唯一會驗金鑰的端點。
limit_req_zone $binary_remote_addr zone=agmcis_login:10m rate=1r/s;

server {
    listen 80;
    server_name _;          # 換成你的網域

    # HTTP 一律導到 HTTPS。**除了 certbot 的挑戰路徑** ——
    # 把那一段也導走的話,憑證更新會永遠失敗,而失敗發生在
    # 三個月後的某一天,沒有人記得為什麼。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;          # 換成你的網域

    # certbot 產生的憑證。見 deploy/HTTPS.md。
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # HSTS。瀏覽器記住「這個網域只走 HTTPS」之後,
    # 連第一次的 HTTP 導向都不會發生 —— 而那次導向是可以被攔的。
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 金鑰走 cookie,所以要防 CSRF 的基本面。
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 上傳沒有用到,關小一點。
    client_max_body_size 1m;

    # ---- 健康檢查:不限流 ----
    #
    # 監控系統會固定頻率打它。把它算進限流的話,監控自己會被擋,
    # 然後你會收到一封「系統掛了」的通知,而系統是好的。
    location = /health {
        proxy_pass http://agmcis;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 登入 ----
    location = / {
        limit_req zone=agmcis_login burst=5 nodelay;
        proxy_pass http://agmcis;
        include /etc/nginx/proxy_params;
    }

    # ---- WebSocket ----
    #
    # 儀表板推播用。Upgrade 與 Connection 這兩個 header 少一個
    # 就會變成一個永遠在重連的連線 —— 而那看起來跟正常運作一樣。
    location /ws {
        proxy_pass http://agmcis;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 行情連線會安靜很久。預設 60 秒會把它砍掉。
        proxy_read_timeout 3600s;
    }

    # ---- 其餘 ----
    location / {
        limit_req zone=agmcis_api burst=20 nodelay;
        proxy_pass http://agmcis;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 回測是長時間動作,但它已經改成非同步任務(第八十五節),
        # 所以 60 秒夠了。要是這裡需要調長,代表有東西該改成任務。
        proxy_read_timeout 60s;
    }
}
