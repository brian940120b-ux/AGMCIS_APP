notes: 'PART 11.1 OFFICIAL_SAC_BASELINE. No flags beyond the step count, on purpose: the defaults
  are the organiser''s recipe and any flag would make this something else. Never resume or
  overwrite this session once trained. RESULT (Kaggle, reference opponent, 20 rounds): won
  15%, killed 0%, crashed 75%, margin +137, best 26.4 deg, cone 0.00. The centred stick crashes
  100%; the recipe learned to survive in a quarter of rounds and never came within 26 degrees
  of the cone. This is the floor every research reward is measured against.

  DECISION: KEEP as the floor (PART 11.1), never promoted. Laptop paired comparison (seed
  1000, 20 rounds): vs v4 5% won / 75% crashed / -721; vs v5 10% / 90% / +96; best aim 11.1
  and 25.8 deg; cone 0. The centred stick crashes 100% on the same engagements, so the recipe
  learned a little survival and nothing of the cone. Hypothesis confirmed: beats the centred
  stick, no kills. The six-opponent scoreboard row is owed once the laptop has scripts/scoreboard.bat;
  it changes nothing above.

  SCOREBOARD (laptop, six scripted opponents, 6 rounds each): won 17-100%, margins +51 to
  +1,854, cone 0.00 everywhere, no kills. Indistinguishable from the centred stick on margin
  except vs pursuit (+1,854 vs +117). KEEP as the floor stands.'
