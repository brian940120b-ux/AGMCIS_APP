id: EXP-001-official-sac-baseline
question: What does the organiser's own recipe reach at 2,000,000 steps, unchanged?
  Every custom reward and observation so far was compared against v4/v5 and a centred
  stick, never against the baseline the brief (PART 11.1) says must exist.
hypothesis: Trained with train.py defaults only (reward=reference, observation=reference,
  action_repeat=1, gamma 0.99, batch 256, built-in reference opponent, no floor, no
  G-limit), the policy beats the centred stick on the fixed scoreboard but scores
  no kills against any scripted opponent. It is the floor the research rewards must
  clear, and its cone+ is the number shaped and pointed are measured against.
