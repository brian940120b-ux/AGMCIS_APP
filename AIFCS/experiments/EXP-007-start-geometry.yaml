  = 4 : 1, SRC-012) instead of the rules'' random start produce a policy that scores
  better on the rules'' random start?'
hypothesis: 'EXP-002''s recipe with --geometry mix. Neutral merges put both aircraft
  in a real fight from the first second, where a random start often begins with the
  two flying apart for a minute; more of each round is spent in the geometry that
  decides it. Expect won and cone+ at or above EXP-002 on the published-start scoreboard
