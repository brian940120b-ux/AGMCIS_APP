id: EXP-002-opponent-distribution
question: Does v6's recipe learn more when the pool holds the scripted set beside
  v4/v5 and the league weights whoever is beating it from the first round (SRC-001,
  SRC-012), instead of two learned opponents sampled uniformly?
hypothesis: 'Same reward, observation, plant and steps as v6. Pool = v4, v5 + break,
  energy, scissors, wanderer, pursuit; --league ema. Expect: on the fixed scoreboard,
  won and margin against the scripted six at or above v6 (90% / +5,501 vs v4 was v6''s
  best), and cone+ above v6''s 2.22 s against at least two scripted opponents, because
  the policy now trains on opponents that turn. Decision rule: keep if won >= v6 on
  4 of 6 and cone+ improves on 2; reject if won falls below v6 on 3 or more.'
