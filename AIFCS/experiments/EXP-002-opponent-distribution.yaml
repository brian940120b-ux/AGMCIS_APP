decision: reject
notes: 'Hypothesis H2 (docs/PRIOR_ART.md 6.6). One factor moved relative to v6: the
  opponent distribution (who is in the pool and how it is sampled). The paper league''s
  gate never opens in a 2,000,000-step run over eight workers, so --league ema is
  what makes weighting real; recorded in league.py. Kaggle: attach the aifcs_pool
  Dataset (v4, v5); the scripted names need nothing. INTERIM (Kaggle): against v4
  this is well below v6 (55%/+426/cone+ 0.22 vs 90%/+5,501/2.22); against v5 60%/+197.
  In training it beat the scripted set (pursuit 98%, scissors 84%, wanderer 74%, break
  62%, energy 40%) but met v4/v5 only ~2 rounds in 7, and the aim reached 0.3 deg
  without holding the cone. The scripted opponents are learnable; the cone is still
  the problem. Also: a centred stick with the floor wins 80% of rounds against v4
  and v5, so ''won'' against the learned pool measures little; margin and cone+ carry
  the signal.

  DECISION (laptop paired comparison, same 20 engagements, seed 1000): v6 beats v8_pool
  on every column against both learned opponents: vs v4 90%/+5,501/cone+ 2.22 against
  60%/+585/0.62; vs v5 75%/+1,001/1.10 against 75%/+246/0.00. The hypothesis'' core
  claim, cone+ above v6, failed, so the scripted-six rows (which need the new code
  on the laptop) cannot rescue it: the decision rule''s ''reject if won falls below
  v6'' is already met on the learned pool. REJECT as a replacement for v6. Kept as
  a pool member and as the comparison base for EXP-003/005/006/007, which each change
  one thing relative to this recipe. What it did show: scripted opponents are learnable
  (training win-rate 98% pursuit, 84% scissors), and the EMA league works; what it
  did not: hold the cone. The six-opponent scoreboard row is owed for the record once
  scripts/scoreboard.bat reaches the laptop.'
