decision: keep
notes: 'INTERIM (Kaggle): vs v4 95%, one kill, cone+ 3.00, mean cone 0.73, 21.5 s
  within 5 deg (more than EXP-008''s 17.7); vs v5 85% with 15% crashes and cone+ 0.70
  (EXP-008: 0.37). Starting inside the cone bought time near the cone and cost survival:
  three crashes in 20 against v5, none for EXP-008. Not a clean win over EXP-008 on
  its own terms; the natural use is as a curriculum stage (resume under --geometry
  published), which the record''s decision rule names. Decision waits for the laptop
  board.

  DECISION (laptop six-opponent board): cone vs reference 3.00 and vs wanderer 3.00,
  with a KILL in one of six rounds against each (killed 17%): the only kills on any
  bench so far, and the rule''s 1.5 s threshold cleared twice. But pursuit 33% (margin
  -649, a loss) and energy 50%: starting inside the cone taught holding it and nothing
  about being attacked or about an opponent that leaves. KEEP as a curriculum stage,
  not as a model: the next use is to resume it under --geometry published with the
  full pool, which the record''s hypothesis named. Candidate for the day only if that
  resume keeps the kills and recovers pursuit.'
