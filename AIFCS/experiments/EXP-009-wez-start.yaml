id: EXP-009-wez-start
question: Does starting inside the attack envelope (the AlphaDogfight shooters' recipe,
  SRC-018) teach holding the cone, which no start from 3-9 thousand feet has?
hypothesis: 'EXP-008''s recipe with --geometry wez: every round begins 700-2800 ft
  behind a target flying away, nose inside the half-angle. The replay buffer fills
  with cone memories instead of approach memories. Expect: cone vs reference above
  1.5 s on the scoreboard (v6: 0.00, v8_pool: 0.72) at the cost of worse margins from
  the rules'' own starts, which a follow-on resume under --geometry published should
  recover. Decision rule: keep as a curriculum stage if cone vs reference or break
  exceeds 1.5 s; reject if it does not beat EXP-008 on cone anywhere.'
