  3-3 Vol 5 / APL (docs/TACTICS.md). The scoring engine''s aspect term is fixed in
  this run (it was inverted for v6 and v8_pool), so the shaped reward now pays for
  the tail position it previously charged for. Expect: on the fixed scoreboard, cone
  vs reference and vs break above v8_pool''s 0.72 / 0.00, and won vs the doctrine
  four above 50% each in training. Decision rule: keep if cone improves on 2 of 6
  bench opponents and no bench opponent falls below v8_pool by more than one round;
  reject if cone stays at zero against everything that turns.'
