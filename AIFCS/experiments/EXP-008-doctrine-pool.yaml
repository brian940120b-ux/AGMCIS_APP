decision: keep
notes: 'INTERIM (Kaggle): vs v4 100% won, ONE KILL in 20 rounds (killed 5%), cone+
  3.00 s, mean cone 0.88 s, 17.7 s within 5 deg in range, best aim 0.0 deg; vs v5
  100%, cone+ 0.37. The first kill this project has produced in evaluation: v6''s
  best was 2.22 s and v8_pool''s 0.22. Two things changed at once relative to EXP-002,
  by design of the record: the doctrine opponents in the pool and the corrected position
  term in the shaped reward; the six-opponent laptop board is what separates them
  from a v4-specific gain. Candidate to replace v6 as the day''s model pending that
  board and a rehearsal on the real host.

  DECISION (laptop six-opponent board): cone vs reference 2.42 and vs wanderer 1.63
  against v8_pool''s 0.72 and 0.00 and v6''s 0.00 everywhere: the first clause (cone
  improves on 2 of 6) is met twice over. The second clause is NOT met: vs pursuit
  it wins 17% against v8_pool''s 83% and v6''s 50%, four rounds down, and its margin
  there (+6,647) is a sixth of v6''s. Everywhere else it beats v6 on margin (reference
  +225,170 vs +60,307) and ties or beats it on won. KEEP as the new base and the champion
  candidate, overriding the second clause on purpose: the cone is the thing nothing
  else has moved, and the pursuit weakness is a named, addressable gap (it is the
  one opponent that attacks). Not yet the day''s model: that needs the paired v9_doctrine-vs-v6
  evaluation, a rehearsal on the real host, and a fix for pursuit (next experiment).

  PAIRED vs v6 (laptop): from the blue seat v9_doctrine does more (+87,946, cone+
  1.08) than v6 does to it (+48,781, 0.42), but both win 90% of their own rows, so
  the seat matters and ''won'' cannot separate them. v9_doctrine also crashes 10%
  against v6 and 20% against itself (v6: 5% / 0%): a crash is a loss on the day. PROVISIONAL
  day model: v9_doctrine, on cone and margin, with two named costs (pursuit, crashes)
  that EXP-011 and a crash look are to settle before the choice is final.'
