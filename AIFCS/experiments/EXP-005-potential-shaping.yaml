id: EXP-005-potential-shaping
question: 'Does paying the tracking bonus as a potential difference (gamma*Phi(s'')
  - Phi(s)) instead of per frame stop the policy from farming near-misses, so that
  time inside one degree rises above what the solid angle gives by chance (v6: 3.8%
  of close time, cone+ 2.22 s)?'
hypothesis: 'EXP-002''s recipe with --reward potential in place of --reward shaped;
  everything else identical. Potential shaping telescopes, so the only frame-by-frame
  money for being in the cone is the official 2,000 a second — the policy is paid
  to stay, not to pass. Expect cone+ above 2.22 s on at least three scripted opponents
  and the ratio of in-cone time to <5-degree time well above 4%; accept a lower won
  if cone+ rises, because kills are what the day pays 1,000+ for. Decision: keep if
  cone+ >= 2.5 on 3 of 6; reject if cone+ falls below v6 on 3 of 6; else inconclusive.'
