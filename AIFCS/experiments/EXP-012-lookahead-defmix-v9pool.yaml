id: EXP-012-lookahead-defmix-v9pool
question: v9_lookahead (the 1 s / 3 s predicted geometry) is the champion on the bench
  and in the pairing; v9_defmix (a quarter of starts on the defensive, a quarter already
  in the enemy's envelope) is the only recipe that got the cone against five of six
  bench opponents and pursuit to 50%. Do the two ingredients add, and does a pool
  of the three v9s (now flown correctly, encoding every frame) hold the gains against
  policies that fight back?
hypothesis: 'EXP-010''s recipe with --geometry defmix, and the pool widened to v9_lookahead,
  v9_defmix and v9_doctrine beside v5 and the scripted eleven. Expect on the bench:
  cone vs reference and wanderer at EXP-010''s 3.00, pursuit won at or above EXP-011''s
  50% with EXP-010''s margin, and crashes under 20% in the pairing (a defensive start
  is where the ground gets close). Decision rule: keep if both-seats vs v9_lookahead
  over 60 rounds is above 56% and no bench opponent falls below EXP-010 by more than
  one round; reject if the pairing is under 50% or the bench cone vs reference drops
  under 1.5 s. Note: the three v9 pool members must be in the Kaggle Dataset as v9_lookahead/,
  v9_defmix/, v9_doctrine/ with card.json beside each checkpoint; the lookahead one
  is 40 wide and the evaluator rebuilds each opponent''s own plant.'
