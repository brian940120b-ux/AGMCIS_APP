  authors: Erik Hofman (model author)
  organization: JSBSim project (GPL)
  url: https://github.com/JSBSim-Team/jsbsim/blob/master/aircraft/f16/f16.xml
  type: simulation model file, read from the installed package
  publication_date: 2001-12-28 (created), revision 1.95 as installed
  access_date: 2026-09-30
  verification: verified
  verification_note: >
    Read from .venv/lib/python3.11/site-packages/jsbsim/aircraft/f16/f16.xml
    (pip jsbsim 1.3.1) on 2026-09-30. The organiser's package ships its own
    copy whose engine differs (see docs/AIRCRAFT_KNOWLEDGE_BASE.md); its
    airframe file was compared earlier and the engine is the only difference
    found.
  applicability: direct
