- id: SRC-007
  title: Self-Play PSRO — Toward Optimal Populations in Two-Player Zero-Sum Games
  url: https://arxiv.org/abs/2207.06541
  type: preprint (arXiv)
  authors: McAleer, Lanier, Wang, Baldi, Fox, Sandholm
  organization: CMU / UC Irvine
  access_date: 2026-09-30
  verification: verified
  verification_note: arXiv PDF (v1, 13 Jul 2022, 15 pages) downloaded and text-extracted 2026-09-30.
  applicability: partial
  applicability_reason: >
    Two-player zero-sum theory; the useful part is the shape of a population
    (best responses plus a time-averaged stochastic policy), not the
    tabular games it is evaluated on (Liar's Dice, Battleship, Leduc).
  extracted:
    - "PSRO adds a deterministic best response to the opponent's least-exploitable population mixture each iteration; it may need every pure strategy before the mixture supports a Nash equilibrium."
    - "SP-PSRO adds two policies per iteration: the time-average of a new stochastic policy trained off-policy against the opponent's best response, and the best response itself. Converges in a few iterations where APSRO needs many."
    - "Practical reading for us: a pool of frozen snapshots plus scripted opponents, sampled by recent win rate, is the cheap approximation the AlphaDogfight winners used (SRC-001); exploiters trained against the current main are the next step (SRC-012 did this)."
  confidence: high

