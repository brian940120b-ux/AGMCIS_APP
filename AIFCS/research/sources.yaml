    with pypdf; sections IV (environment), V (agent), VI (training) and VII
    (results) read in full. The observation list is in supplemental material
    not retrieved. US government work sponsored by DARPA; the paper is public
    (arXiv). Designs cited and re-implemented only; no code was published.
  applicability: direct
  applicability_reason: >
    The ADT weapon engagement zone is the organiser's rule verbatim: 500-3000 ft
    and a 2-degree cone off the nose, 300-second engagements, F-16 in JSBSim,
    continuous aileron/elevator/rudder/throttle. The organiser (and the Korean
