- id: SRC-015
  title: "LAG — Light Aircraft Game: JSBSim-based competitive aircraft RL environment"
  url: https://github.com/liuqh16/LAG
  type: source code (GPL-3.0)
  access_date: 2026-09-30
  verification: verified
  verification_note: Cloned (commit ebd3a38) and read the reward functions, the 1v1 NoWeapon self-play config and the self-play runner.
  applicability: partial
