  extracted:
    - "Low-speed, subscale wind-tunnel data for an F-16-like configuration; the same lineage that Stevens & Lewis (SRC-004) tabulate for their F-16 model."
    - "Documented behaviours of that configuration: pitch departure in rapid rolls at low speed, deep stall at high alpha, both addressed by control-system limiting — consistent with why the sample client rate-limits and caps the elevator."
  confidence: high

- id: SRC-009
  title: "Energy-Maneuverability (U)"
  authors: John R. Boyd, Thomas P. Christie, James E. Gibson
  organization: Air Proving Ground Center, Eglin AFB
  report_number: APGC-TR-66-4, Volume I (Project 0350T4), DTIC AD372287
  url: https://www.archives.gov/files/declassification/iscap/pdf/2011-052-doc1.pdf
  alt_url: https://everyspec.com/USAF/USAF-General/RPT_0350T4_ENERGY-MANEUVERABILITY_THEORY_VOL-1_15JAN1966_BOYD_56433/
  type: USAF technical report, declassified (ISCAP 2011-052)
  publication_date: 1966-03
  access_date: 2026-09-30
  verification: verified
  verification_note: >
    The archives.gov PDF (92 pages) was downloaded and its text extracted:
    title page "ENERGY-MANEUVERABILITY (U)" by Boyd, Christie and Gibson;
    foreword dates the effort 15 June 1965 onward, Project 0350T4, Volume I
    = theory, sample application and mathematical model; declassification
    stamps NASIC/ACAA; and on the page defining energy rate, specific excess
    power written as Ps = (Ta - D)/W * V. The everyspec listing (Vol. 1,
    15 Jan 1966) describes the same report.
  applicability: partial
  applicability_reason: >
    Defines specific excess power Ps = V(T - D)/W and the G-V / H-M diagram
    method. Relevant as the vocabulary for reading a trace (is the policy
    bleeding energy to hold the cone?) and as a possible research-tier
    reward term. Not used anywhere yet; if it ever is, it is a research-tier
    experiment with a record under experiments/, never an official change.
  extracted:
    - "Ps = V (T - D) / W: energy rate per unit weight; positive means the aircraft can climb or accelerate, negative means it is spending altitude or speed to turn."
    - "Instantaneous manoeuvrability is read from load factor vs velocity (G-V); sustained manoeuvrability from altitude vs Mach (H-M) with Ps contours."
    - "The report's own sample application is F-4C vs MiG-21 at 1G/3G/5G, maximum and military power."
  confidence: high

