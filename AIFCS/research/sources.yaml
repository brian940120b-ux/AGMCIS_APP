- id: SRC-016
  title: "T-45A UJPT/ADV/IUT Air Combat Maneuvering Flight Procedures — Flight Support Lecture Guide (CNATRA P-1230, Rev 10-98)"
  organization: US Naval Air Training Command, NAS Corpus Christi
  url: https://server.3rd-wing.net/public/Photun/Manual%20combat%20aerien_acm.pdf
  type: US Navy training publication (public), 235 pages, mirrored copy
  publication_date: 1998-10
  access_date: 2026-09-30
  verification: verified
  verification_note: >
    PDF downloaded and text-extracted (pypdf). Title page is font-encoded but
    the change-summary and every lesson page identify it as the T-45A ACMFP
    FSLG, 10-98 Original. Stands in for Shaw (SRC-003), which could not be
    read: same doctrine, a primary public source, with numbers.
  applicability: direct
  applicability_reason: Doctrine for exactly the 1v1 guns problem, written to be taught; the source for our scripted adversaries' vocabulary and for reading traces.
  extracted:
    - "One-circle: both fight for the same turn circle, advantage to the smaller circle (radius). Two-circle: each in its own circle, advantage to the better turn rate. Out-of-plane: nose high collapses the circle / stops closure; nose low increases rate and cuts radius."
    - "High yo-yo = lag pursuit to stop a 3/9-line overshoot: quarter-roll out of the bandit's plane, pull nose up to collapse the circle. Low yo-yo = lead pursuit to raise turn rate: overbank, nose low, pull inside the bandit's turn, fire in the envelope, expect overshoot."
    - "T-45 numbers, for scale only: cornering speed about 410 kt, manoeuvring band 300-350 KIAS; sustained turn at 15-16 units AOA; training rule minimum guns range 1,000 ft, head-on guns prohibited; 2,500 ft above the hard deck needed for a nose-low reversal."
    - "Bubble = the aircraft's maximum-performance turn circle in the current plane of motion; post = its centre, one turn radius from the aircraft. Holding lead pursuit ahead of the bandit's post produces a 3/9 overshoot."
  confidence: high

