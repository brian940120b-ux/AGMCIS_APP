# Research source registry (brief PART 18.3).
#
# One entry per source actually consulted, with what it yielded and how far it
# was verified. "verified" means the primary text was read; "abstract-only"
# means only a summary was reachable; "unreachable" means the source was found
# but its text could not be fetched from the environment that tried, and its
# claims are therefore NOT to be used until someone reads it.
#
# Nothing in here modifies official code, official specifications or the
# competition rules. A source feeds a hypothesis, a hypothesis feeds an
# experiment record under experiments/, and only an experiment result can
# change a model.

- id: SRC-001
  title: Hierarchical Reinforcement Learning for Air Combat at DARPA's AlphaDogfight Trials
  authors: Pope, Ide, Micovic, Diaz, Rosenbluth, Ritholtz, Twedt, Walker, Alcedo, Javorsek
  organization: Lockheed Martin (PHANG-MAN), DARPA ACE
  url: https://arxiv.org/abs/2105.00990
  type: peer-reviewed preprint (arXiv), later IEEE
  publication_date: 2021-05
  access_date: 2026-09-28
  verification: verified
  applicability: direct
  applicability_reason: >
    The organiser's firing condition is this paper's WEZ verbatim: 500-3000 ft,
    2 degree aperture. The organiser added an accumulated 3 s. Same aircraft
    (F-16 in JSBSim), same 1v1 gun-only problem.
  extracted:
    - "Two tracking rewards: a global linear track-angle penalty and a logistic gun-snap term of steepness 1e5 centred on the 1-degree cone. We had only the linear one."
    - "Curriculum: scripted 'easy' opponents only until win rate > 50%, then learned opponents added; sampling weighted by last-100-matchup win rate, clipped to 0.2%-11.7%."
    - "Health x10 for shooter policies specifically to raise the ratio of WEZ to non-WEZ samples in the replay buffer."
    - "Low-level policies at 50 Hz; policy selector at 10 Hz."
    - "30 opponents in total."
  related_experiments: [EXP-002-planned]
  confidence: high

