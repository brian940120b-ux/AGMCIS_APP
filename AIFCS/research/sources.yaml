- id: SRC-018
  title: "Hierarchical Reinforcement Learning for Air Combat at DARPA's AlphaDogfight Trials (PHANG-MAN, 2nd place)"
  authors: Pope, Ide, Micovic, Diaz, Twedt, Alcedo, Walker, Rosenbluth, Ritholtz, Javorsek
  organization: Lockheed Martin AI Center / DARPA; IEEE Transactions on Artificial Intelligence (accepted); arXiv 2105.00990v3
