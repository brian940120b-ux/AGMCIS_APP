    - "Metrics: wing area 300 ft2, span 30 ft, chord 11.32 ft, horizontal tail 63.7 ft2 at 16.46 ft arm, vertical tail 54.75 ft2; aero reference point x = -189.5 in."
    - "Engine as pip installs it: F100-PW-229, milthrust 17,800 lbf, maxthrust 29,000 lbf, bypass ratio 0.4, idle N2 53, augmented."
  confidence: high
