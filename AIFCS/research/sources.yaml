# ------------------------------------------------ same problem, elsewhere
# Found 2026-09-30 by searching for open JSBSim F-16 1v1 gun-dogfight RL
# environments. A Korean university competition ran the same problem two
# months before ours, and its winners published their code.

- id: SRC-011
  title: "2026 AI Pilot Top Gun Challenge — competition rules"
  organization: Korea Aerospace University (SW-centred university programme)
  url: https://aipilot2026.kau.ac.kr/
  also: https://view.asiae.co.kr/article/2026091611483229259
  type: competition website + press coverage
  publication_date: 2026 (preliminaries 2026-08-27/28, finals 2026-09-17)
  access_date: 2026-09-30
  verification: verified
  verification_note: Rules page read; asiae.co.kr article read. 290 teams / 873 people from ~80 universities, 16 finalists.
  applicability: direct
  applicability_reason: >
    Same aircraft (JSBSim F-16), same 1v1 gun-only problem, and phase 1 of
    their firing envelope is our envelope exactly: 2 degrees, 500-3,000 ft.
    Differences that matter: 200 s not 300 s; their envelope widens at 100 s
    (4 deg, 3,500 ft) and 150 s (6 deg, 4,000 ft); their kill is an HP model
    integrated at a range-dependent rate (1.0/s at 500 ft falling linearly
    to 0 at the max range; 0.3 and 0.1 in the later tiers), not an
    accumulated 3 s; the loser on HP at timeout loses. Nothing of theirs
    changes anything of ours; it is the closest public evidence of what
    works on this exact geometry.
  extracted:
    - "Firing envelope: 0-100 s 2 deg / 500-3,000 ft; 100-150 s 4 deg / 500-3,500 ft; 150-200 s 6 deg / 500-4,000 ft."
    - "Win by shoot-down, else by remaining HP. Widening envelope exists explicitly to stop pure evasion from being a winning policy."
  confidence: high

- id: SRC-012
  title: "2026 AI Pilot Challenge — 1st place solution (DogFightEnv, team 추락도락이다)"
  url: https://github.com/idearendil/2026_AI_Pilot_Challenge-1st_Solution
  type: source code (public repository, NO LICENSE FILE)
  access_date: 2026-09-30
  verification: verified
  verification_note: >
    Cloned (commit e677b4b) and read: README, src/dogfight/config.py,
    claude_code/my_reward.py, claude_code/my_observation.py (header and
    damage rule), claude_code/train.py (argument defaults),
    cuda_fdm/obs_reward.py, cuda_fdm/rl_env.py. No LICENSE file: code is
    not to be copied into this repository; designs may be cited and
    re-implemented from the description with attribution.
  applicability: direct
  applicability_reason: Winner of SRC-011 on the same aircraft and envelope; the fullest public record of a winning recipe for this geometry.
  extracted:
    - "Algorithm: PPO, MLP 512x512x512 tanh, factorised categorical head with 21 bins per axis; lr 1e-4, gamma 0.98, GAE 0.95, clip 0.2, 5 epochs, minibatch 512, entropy 1e-4, target KL 0.05, 80,000 rollout steps per iteration, observation normalisation on, left-right mirror augmentation on by default."
    - "Observation (claude164r, 214 wide): 50 frame-invariant scalars (speed, HP, energy-height difference, slant range, closure, sin/cos of ATA/AA/LOS az-el, aim and range margins, time, both attitudes, both velocity-frame bank angles, fuel, instantaneous damage rate dealt and taken, pursuit score, absolute altitudes) plus 7 direction vectors (gravity, LOS, own/target/relative velocity, own/target angular rate) expressed in 6 frames (world, own body, target body, own velocity, target velocity, LOS). Angular rates are reconstructed from successive attitudes via SO(3) log because the server does not send them."
    - "Reward (my_reward.py): per-step (target HP loss - own HP loss * own_damage_weight) * damage_scale with damage_scale 10 and own_damage_weight scheduled 0.5 -> 1.0; plus a potential-difference shaping term (x_cur - x_prev) * 5e-5 where x combines range in ft and both aircraft's ATA, sized so a whole episode of shaping is worth about one hit; win/loss terminal 0; falling below the altitude floor costs the remaining HP * damage_scale. All altitude shaping was removed."
    - "Opponent pool (train.py defaults): 7 slots; behaviour-tree DLL baselines never evicted; team MPC agent and the organiser's cut-off exe as fixed opponents; learning snapshots promoted when the minimum EMA win rate over candidates exceeds 0.6 (EMA alpha 0.1); sampling p_i = 0.5 * uniform + 0.5 * softmax(-ema_i / 0.3), so the opponents it loses to are sampled more."
    - "Exploiters: every 500 main iterations, freeze main, train a fresh exploiter against it alone until 70% win rate or 500 iterations, add it to the pool as never-evict."
    - "Initial-state distribution: 3-9 line (abreast, opposite headings) : head-on = 4 : 1, head-on separation 5,539 m. Submission trained on the 3-9 scenario."
    - "GPU pipeline: the JSBSim F-16 FDM re-implemented as a CUDA kernel (cuda_fdm/gen) with golden-trajectory regression tests against JSBSim (tests/val_fulltraj.py, golden_ref.bin), running thousands of environments in parallel."
    - "Evaluation: power_test (two agents, N games, significance), final_power_test (one model vs all 8 BT/MPC baselines), league (round-robin heatmap); 10 Hz or 60 Hz control and argmax or stochastic chosen per slot; Tacview CSV logging and a replay viewer."
  confidence: high

