- id: SRC-006
  title: "Hierarchical Reinforcement Learning with Automatic Curriculum Generation for UCAV Tactical Decision-Making in Autonomous Air Combat"
  authors: Li, Dong, Zhang, Zhai, Li
  organization: MDPI Drones 9(5):384
  url: https://doi.org/10.3390/drones9050384
  publication_date: 2025-05
  access_date: 2026-09-30
  verification: verified
  verification_note: >
    MDPI, the DOI redirect, ADS and the OA PDF all return 403 from this
    environment (Unpaywall confirms it is CC-BY gold OA). Reached 2026-09-30
    through the r.jina.ai reader proxy, full text. Semantic Scholar record
    matches (CorpusId 278837871).
  applicability: partial
  applicability_reason: >
    WVR 1v1 on a JSBSim 1.1.6 F-16 at 50 Hz with a conical gun zone
    (150-1000 m), so the geometry vocabulary transfers; the hierarchical
    option framework and WGAN curriculum are beyond what 38 days allow.
  extracted:
    - "Observation: 8 normalised states (range, closure, AA, ATA, VIAS, altitude, alpha, beta). Action: continuous (aileron, rudder, elevator, throttle)."
    - "Three low-level tactics with rewards R = R_goal + R_shaping + R_regularisation: angle = c0*Phi_ATA*Phi_AA*Phi_range + c1*Phi_energy; snapshot = c0*Phi_ATA*Phi_range + Phi_AA + c1*Phi_energy; energy = c0*Phi_ATA*Phi_range*Phi_energy + c1*Phi_AA. All plus a proximity term."
    - "Regularisation: altitude violation -1.0, stall alpha violation -1.0, sideslip penalty, action cost -0.1*action^2."
    - "Opponent: one rule-based expert built from doctrine. Final win rate ~0.8 vs it; single tactics 0.4-0.6; DAC+PPO 0.6."
    - "WGAN-generated initial conditions of intermediate difficulty raised tactic win rate by 0.2-0.4 versus random sampling and shortened convergence."
