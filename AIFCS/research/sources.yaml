    - "PostureReward = orientation(AO, TA) * range(R), potential-based, scale 100; orientation v2 = 1/(50*AO/pi + 2) + 1/2 + min(arctanh(1 - max(2*TA/pi, 1e-4))/(2*pi), 0) + 0.5; range v3 = 1 for R < 5 km, then a clipped quadratic in R, plus a small exp(-0.16 R) tail."
