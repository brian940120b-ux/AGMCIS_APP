# AIFCS — Simulation configuration
# All values describe a FICTIONAL, abstract simulation world.
# They are research/teaching parameters, not real-world platform data.

simulation:
  # Fixed-timestep simulation clock. 60 Hz => dt = 1/60 s.
  tick_rate_hz: 60
  # Allowed wall-clock speed multipliers exposed by the API.
  allowed_speeds: [0.25, 0.5, 1.0, 2.0, 5.0, 10.0, 50.0]
  default_speed: 1.0
  # Hard stop for a single run, in simulation seconds (safety valve).
  max_duration_s: 3600.0
  # Deterministic mode: fixed seed + fixed timestep => reproducible runs.
  deterministic: true
  seed: 20260918

world:
  # Abstract local-tangent-plane box, metres. Origin (0,0,0) is the scenario datum.
  bounds:
    x_min: -100000.0
    x_max: 100000.0
    y_min: -100000.0
    y_max: 100000.0
    altitude_min: 0.0
    altitude_max: 20000.0
  gravity_mps2: 9.80665
  # Simplified constant-density atmosphere for MVP-01; replaced in later phases.
  air_density_kgpm3: 1.225

physics:
  # Which motion integrator advances the world (PHASE 16).
  #   simple_6dof  this platform's own Newton-Euler model, RK4 (default)
  #   jsbsim       the JSBSim flight dynamics model — optional, `pip install jsbsim`
  #   kinematic    constant velocity, no forces at all
  #   null         nothing moves
  # Selecting jsbsim without the package installed is an error naming what to
  # install. It never falls back quietly to a different model than the one the
  # run was configured for.
  #
  # The two 6DOF backends fly the SAME fictional airframe: the JSBSim aircraft
  # files are generated from the very same AircraftParameters. They differ in
  # the model, most visibly the atmosphere — JSBSim's density falls with
  # altitude, air_density_kgpm3 above is constant.
  backend: simple_6dof
  jsbsim:
    # Generated airframes are cached here. It is not a directory to edit:
    # anything in it is rewritten when AircraftParameters changes.
    data_root: data/jsbsim
    # Where the flat world plane is pinned on JSBSim's geodetic model.
    # Fictional and arbitrary — nothing depends on the location.
    reference_latitude_deg: 0.0
    reference_longitude_deg: 0.0

sensors:
  # Perception limits between the truth state and an agent (PHASE 5).
  # An agent sees an estimate, never the world itself.
  enabled: true
  max_range_m: 80000.0          # beyond this a contact is simply not reported
  field_of_regard_deg: 120.0    # half-angle from the nose; 180 = all-round.
                                # Narrower than all-round on purpose: on its own
                                # this breaks formation flying, and the datalink
                                # below is what makes it survivable. Turn comms
                                # off to see the coupling.
  latency_s: 0.2                # contacts are reported where they were, not are
  dropout_probability: 0.05     # chance a detection is missed each cycle
  track_memory_s: 3.0           # how long a missed contact is coasted
  position_noise_base_m: 20.0
  position_noise_per_km_m: 2.0  # angular error projects further with range
  velocity_noise_mps: 3.0
  ownship_position_noise_m: 5.0 # an aircraft does not know its own state exactly
  ownship_velocity_noise_mps: 0.5

communications:
  # Abstract datalink between fictional units (PHASE 6). A simulation transport
  # only — it does no real networking and implements nothing that scans,
  # manipulates or interferes with anything.
  enabled: true
  latency_base_s: 0.15          # nominal one-way delay
  latency_jitter_s: 0.08        # jitter, which is what reorders messages
  packet_loss_probability: 0.03
  max_messages_per_second: 20.0 # bandwidth per sender; excess is dropped, not queued
  report_rate_hz: 4.0           # how often a unit shares its own position
  blackout_windows: []          # e.g. [[120.0, 150.0]] to cut the link for 30 s

telemetry:
  # How often the WebSocket layer broadcasts world state (Hz). Independent of tick rate.
  broadcast_rate_hz: 20
  # Maximum entities serialized per broadcast frame.
  max_entities_per_frame: 64

logging:
  level: INFO
  # Structured JSON logs (one object per line) for machine parsing.
  json: true
  directory: data/telemetry
