# AIFCS — Training configuration. Consumed from PHASE 11 (Gymnasium) onward.
training:
  device: auto            # auto | cpu | cuda
  output_directory: models
  log_directory: data/training

ppo:
  total_timesteps: 200000
  n_steps: 2048
  batch_size: 64
  learning_rate: 0.0003
  gamma: 0.99

sac:
  total_timesteps: 200000
  batch_size: 256
  learning_rate: 0.0003
  gamma: 0.99

reward:
  # Every reward term is weighted and logged separately so totals stay explainable.
  weights:
    survival: 1.0
    navigation: 1.0
    formation: 0.5
    mission: 2.0
    coordination: 0.5
    information: 0.25
    collision_penalty: -5.0
    energy_penalty: -0.1
    control_smoothness: 0.2
