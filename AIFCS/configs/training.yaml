# AIFCS — Training configuration. Consumed from PHASE 11 (Gymnasium) onward.
training:
  device: auto            # auto | cpu | cuda
  output_directory: models
  log_directory: data/training
  # The task the environment trains on. demo_alpha's first leg is 40 km — about
  # three minutes at cruise — so an episode would end before the aircraft
  # reached a single waypoint and the navigation reward would never fire.
  scenario: training_navigation
  entity_id: null         # null = the first agent-flown unit in the scenario
  max_episode_seconds: 120.0
  # Ceiling on a job started from the dashboard (PHASE 18). A browser request
  # should not be able to commit the server to a week of compute. The command
  # line has no cap — a long run belongs there, where it can be watched.
  max_timesteps_per_job: 500000
  # Ceiling on an evaluation started from the dashboard (PHASE 19). Each episode
  # runs to the episode limit above, so this is minutes, not seconds.
  max_evaluation_episodes: 20

ppo:
  total_timesteps: 200000
  n_steps: 2048
  batch_size: 64
  learning_rate: 0.0003
  gamma: 0.99

sac:
  total_timesteps: 200000
  batch_size: 256
  learning_rate: 0.0003
  gamma: 0.99

reward:
  # Every reward term is weighted and logged separately so totals stay explainable.
  #
  # The per-step terms are small on purpose. Measured over a 400-step episode,
  # survival, coordination, information and smoothness contributed a nearly
  # constant 760 out of ~780 total reward, while navigation — the only term the
  # policy could actually change — moved by about +/-40. A policy cannot learn
  # from 5% signal. So the terms a policy cannot influence are worth little per
  # step, and the ones it can are worth a lot.
  weights:
    survival: 0.05          # per step alive and inside the altitude band
    navigation: 1.0         # progress towards the active goal
    formation: 0.5          # station keeping, for a unit with a leader
    mission: 5.0            # reaching a waypoint
    coordination: 0.05      # teammates currently held in the picture
    information: 0.05       # confidence and freshness of that picture
    crash_penalty: -50.0    # paid once, when the aircraft is lost
    collision_penalty: -5.0 # grows as separation closes
    energy_penalty: -0.1    # throttle actually used
    control_smoothness: 0.05
