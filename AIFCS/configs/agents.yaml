# AIFCS — Agent configuration
# Agents are abstract decision-making processes for simulation research.

agents:
  default_type: rule
  # Decision rate is decoupled from the physics tick: agents think slower than they fly.
  decision_rate_hz: 10
  # Reject/clamp any action that fails validation instead of trusting the agent.
  strict_action_validation: true
  # Coordination (PHASE 15). A commander allocates high-level tasks — patrol
  # this route, hold station on that unit — and never touches a control
  # surface. Its orders travel over the simulated datalink, so they can be
  # delayed or lost like anything else.
  commander_enabled: true
  # Deliberately slow: re-allocating faster than an order can arrive and be
  # acted on only produces churn.
  commander_rate_hz: 0.5

rule_agent:
  # Abstract behaviour tuning for the rule-based pilot (PHASE 3).
  waypoint_capture_radius_m: 800.0        # how close counts as reaching a waypoint
  formation_spacing_m: 850.0              # nominal wingman separation
  formation_station_tolerance_m: 150.0    # inside this, the wingman is "in station"
  # Must stay well below formation_spacing_m: a wingman deliberately holding
  # station is not a conflict, and if this radius overlaps the formation
  # position both aircraft turn away from their own partner.
  collision_radius_m: 200.0               # closer than this triggers AVOID
  cruise_speed_mps: 220.0                 # trimmed cruise for the demo airframe
  max_bank_deg: 60.0                      # bank limit used by the guidance loop

rl_agent:
  # Populated in PHASE 11+. Present so the schema is stable from PHASE 0.
  model_path: null
  deterministic_inference: true

# Safety layer (PHASE 4). Enforced by the flight controller on every command,
# whoever issued it — rule agent, RL policy or API call.
safety:
  max_control_rate_per_s: 4.0    # how fast a normalised surface may slew
  max_load_factor: 9.0           # structural g limit; pitch demand is eased back
  min_altitude_m: 100.0          # descent demand is blocked inside the buffer
  max_altitude_m: 19000.0
  altitude_buffer_m: 500.0       # soft band where protection ramps in
  reject_on_invalid_state: true  # refuse to command an aircraft in a broken state
