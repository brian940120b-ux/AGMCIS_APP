# The experiments, as a ladder for the laptop.
#
# Not in configs/: that directory is the platform's settings, and a test
# checks that every section of every file in it is read by load_settings.
# A training plan is not a setting, and the test was right to say so.
#
# Run it with:  scripts/ladder.sh plans/ladder.yaml
# See it without running it:  scripts/ladder.sh plans/ladder.yaml --dry-run
#
# The records under experiments/ are the source of truth for what each step
# is and why (EXP-002 to EXP-007); this file is the same recipes in the order
# a laptop would run them overnight, one after another. Kaggle runs them as
# separate notebook versions instead (docs/TRAINING_ROADMAP.md 4.5).
#
# A pool may name scripted opponents (break, energy, scissors, wanderer,
# pursuit, reference) beside sessions; only the sessions have to exist under
# models/competition. v4 and v5 are not steps: they exist already.
#
# Safe to rerun. A step already at its target is skipped and a part-finished
# one resumes.

steps:
  # EXP-002: v6's recipe, one change — the opponent distribution. The
  # scripted set joins v4 and v5 in the pool, and the league weights whoever
  # is beating the policy from the first round (the paper rule's gate never
  # opens in a 2,000,000-step run; see league.py).
  - name: v8_pool
    flags: >-
      --reward shaped --rudder-limit 0.6
      --ground-avoidance --g-limit 9
      --action-repeat 6 --gamma 0.995 --gradient-steps -1
      --observation extended --batch-size 512 --league ema --timesteps 2000000
    pool: [v4, v5, break, energy, scissors, wanderer, pursuit]

  # EXP-003: v8_pool plus mirrored replay.
  - name: v8_mirror
    flags: >-
      --reward shaped --rudder-limit 0.6
      --ground-avoidance --g-limit 9
      --action-repeat 6 --gamma 0.995 --gradient-steps -1
      --observation extended --batch-size 512 --league ema --mirror --timesteps 2000000
    pool: [v4, v5, break, energy, scissors, wanderer, pursuit]

  # EXP-005: v8_pool with the tracking bonus paid as a potential difference.
  - name: v8_potential
    flags: >-
      --reward potential --rudder-limit 0.6
      --ground-avoidance --g-limit 9
      --action-repeat 6 --gamma 0.995 --gradient-steps -1
      --observation extended --batch-size 512 --league ema --timesteps 2000000
    pool: [v4, v5, break, energy, scissors, wanderer, pursuit]

  # EXP-006: v8_pool on the 105-wide frames observation.
  - name: v8_frames
    flags: >-
      --reward shaped --rudder-limit 0.6
      --ground-avoidance --g-limit 9
      --action-repeat 6 --gamma 0.995 --gradient-steps -1
      --observation frames --batch-size 512 --league ema --timesteps 2000000
    pool: [v4, v5, break, energy, scissors, wanderer, pursuit]

  # EXP-007: v8_pool trained on abreast : head-on = 4 : 1 starts. Scored, as
  # every step is, on the rules' random start.
  - name: v8_mix
    flags: >-
      --reward shaped --rudder-limit 0.6
      --ground-avoidance --g-limit 9
      --action-repeat 6 --gamma 0.995 --gradient-steps -1
      --observation extended --batch-size 512 --league ema --geometry mix --timesteps 2000000
    pool: [v4, v5, break, energy, scissors, wanderer, pursuit]
