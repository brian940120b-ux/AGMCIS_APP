# TEAM_EIGHT — eight fictional units, two teams of four (PHASE 14).
#
# Everything here is FICTIONAL and abstract. This is a transit exercise used to
# test coordination at scale: each team has two leaders flying separate
# circuits, each with a wingman holding station. Nothing models weapons,
# engagement or targeting.
#
# Why eight: the plan calls for scaling 1 -> 2 -> 4 -> 8 agents, and eight is
# where the commander has something to actually allocate — two pairs per team,
# so losing a leader leaves a real choice about who takes over.
#
# The two teams are separated in altitude (BLUE 6 km, RED 8 km) and the pairs
# are separated laterally, so nothing is on a collision course by construction.
#
# Coordinates are metres in a local tangent plane: +X east, +Y north, +Z up.

scenario:
  name: team_eight
  description: >
    Eight fictional flight units in two teams of four. Each team flies two
    two-ship elements on separate circuits. Used to exercise the commander,
    the task layer and the datalink at scale.
  version: "1.0"
  duration: 600
  seed: 20260501

