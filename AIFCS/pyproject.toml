[project]
name = "aifcs"
version = "0.1.0"
description = "AI Flight Command & Simulation Platform — fictional multi-agent flight simulation for AI research."
requires-python = ">=3.11"

# Installing the project gives you the `aifcs` command directly. Without an
# install, scripts/aifcs runs the same entry point out of the virtualenv.
[project.scripts]
aifcs = "cli:main"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]
exclude = [".venv", "frontend", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the documented idiom.
    "RUF012",  # Mutable class attrs: Pydantic models handle this themselves.
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E402"]  # conftest adjusts sys.path before importing app code.

[tool.mypy]
# 3.12, not the 3.11 floor in requires-python, and not by choice. mypy applies
# this version to every file it parses, third-party stubs included, and numpy's
# stubs now use PEP 695 `type` statements, which are 3.12 syntax. At 3.11 mypy
# stops at numpy/__init__.pyi with a [syntax] error and "errors prevented
# further checking" — so none of our own code is checked at all. A per-module
# override cannot help: a parse error happens before any per-module setting is
# consulted (follow_imports = "skip" and ignore_errors = true were both tried
# and both still fail).
#
# What this costs: mypy will no longer object if our own code uses 3.12-only
# syntax, which would break the 3.11 installs this project still supports. That
# floor is held by actually running the code on 3.11 instead.
python_version = "3.12"
files = ["backend"]
mypy_path = "backend"
explicit_package_bases = true
namespace_packages = true
exclude = ["\\.venv", "frontend"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
